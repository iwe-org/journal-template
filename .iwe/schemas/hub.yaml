$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  A page that lists other documents with inclusion links: the start page and
  the People, Groups, Organizations, Events, Journal and Chapters hubs. Each
  is one "# Title" heading; a hub may group its links under "## " headings,
  such as circles on People or months on Journal.
maxDepth: 2
frontmatter:
  type: object
  required: [type]
  additionalProperties: false
  properties:
    type: { const: hub }
sections:
  - maxContains: 1
    description: a hub is one "# Title" heading
additionalSections: false
