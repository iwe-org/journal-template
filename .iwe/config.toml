version = 4

[markdown]
refs_extension = ".md"
date_format = "%Y-%m-%d"

[markdown.formatting]
preserve_line_breaks = true

[workspace]
path = "graph"
date_format = "%Y-%m-%d"

[search]
language = "english"

[completion]

[templates.default]
key_template = "{{slug}}"
document_template = """
# {{title}}

{{content}}"""

[actions.today]
type = "attach"
title = "Add to Today's Entry"
key_template = "journal/{{today}}"
document_template = """
---
type: entry
date: {{today}}
---

# {{today}}

{{content}}
"""

[actions.extract]
type = "extract"
title = "Extract"
link_type = "markdown"
key_template = "{{id}}"

[actions.extract_all]
type = "extract_all"
title = "Extract all subsections"
link_type = "markdown"
key_template = "{{id}}"

[actions.link]
type = "link"
title = "Link"
link_type = "markdown"
key_template = "{{id}}"

[actions.inline_section]
type = "inline"
title = "Inline section"
inline_type = "section"
keep_target = false

[actions.inline_quote]
type = "inline"
title = "Inline quote"
inline_type = "quote"
keep_target = false

[actions.sort]
type = "sort"
title = "Sort A-Z"
reverse = false

[actions.sort_desc]
type = "sort"
title = "Sort Z-A"
reverse = true

[schemas.hub]
match = ["index", "people", "groups", "organizations", "events", "journal", "chapters"]

[schemas.person]
match = "people/**"

[schemas.group]
match = "groups/**"

[schemas.organization]
match = "organizations/**"

[schemas.event]
match = "events/**"

[schemas.entry]
match = "journal/**"

[schemas.chapter]
match = "chapters/**"
